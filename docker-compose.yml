services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gmao-sqlserver
    environment:
      TZ: "Africa/Tunis"   # heure locale de SQL Server (GETDATE)
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Password123"
      MSSQL_PID: "Express"
    # Reachable from the server itself (admin tools) but not from the factory network
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - gmao-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong!Password123 -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # .NET Core Backend API
  backend:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: gmao-backend
    environment:
      - TZ=Africa/Tunis   # heure locale : retards, dates du jour, horodatages
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=gmao;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=True;
      # Explorateur de données : compte SQL en lecture seule (voir database/explorateur-lecture-seule.sql)
      # - ConnectionStrings__Explorateur=Server=sqlserver;Database=gmao;User Id=gmao_lecture;Password=<mot de passe>;TrustServerCertificate=True;
      # Données de démonstration (une seule fois, jamais en production réelle)
      # - DemoData__Seed=true
      - ChatbotService__Url=http://chatbot:5002
    # The browser reaches the API through nginx (/api); no direct LAN access
    ports:
      - "127.0.0.1:5000:80"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - gmao-network
    restart: unless-stopped

  # Python Chatbot Service
  chatbot:
    build:
      context: ./gmaochat
      dockerfile: Dockerfile
    container_name: gmao-chatbot
    environment:
      - DATABASE_CONNECTION=Server=sqlserver;Database=gmao;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=True;
    ports:
      - "5002:5002"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - gmao-network
    restart: unless-stopped

  # Angular Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gmao-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - gmao-network
    restart: unless-stopped

networks:
  gmao-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
