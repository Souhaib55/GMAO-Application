<div class="auth">
  <app-auth-visual></app-auth-visual>

  <section class="auth-main">
    <div class="auth-column">
      <header class="auth-top">
        <img class="logo" src="assets/Logo-SIMOTEX-1.png" alt="SIMOTEX" />
      </header>

      <div class="form-header">
        <h1>Connexion</h1>
        <p>Connectez-vous pour accéder à votre espace maintenance.</p>
      </div>

      <div *ngIf="error" class="alert-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ error }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="icon-label">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4 4-6.5 8-6.5s7.2 2.5 8 6.5"/></svg>
            Adresse email
          </label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Entrez votre adresse email"
            autocomplete="username"
            [class.error]="email?.invalid && email?.touched"
          />
          <span *ngIf="email?.invalid && email?.touched" class="error-text">
            <ng-container *ngIf="email?.errors?.['required']">Saisissez votre adresse email.</ng-container>
            <ng-container *ngIf="email?.errors?.['email']">Cette adresse email n'est pas valide.</ng-container>
          </span>
        </div>

        <div class="form-group">
          <label for="password" class="icon-label">
            <svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
            Mot de passe
          </label>
          <div class="password-input">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Entrez votre mot de passe"
              autocomplete="current-password"
              [class.error]="password?.invalid && password?.touched"
            />
            <button type="button" class="toggle-btn" (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
              {{ showPassword ? 'Masquer' : 'Afficher' }}
            </button>
          </div>
          <span *ngIf="password?.invalid && password?.touched" class="error-text">
            <ng-container *ngIf="password?.errors?.['required']">Saisissez votre mot de passe.</ng-container>
          </span>
        </div>

        <div class="form-options">
          <label class="checkbox">
            <input type="checkbox" formControlName="rememberMe" />
            <span>Rester connecté</span>
          </label>
          <a routerLink="/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || loading">
          <ng-container *ngIf="!loading">
            <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>
            Se connecter
          </ng-container>
          <ng-container *ngIf="loading"><span class="spinner" aria-hidden="true"></span>Connexion…</ng-container>
        </button>
      </form>

      <footer class="auth-foot">
        © {{ currentYear }} GMAO — Alcodex. Tous droits réservés.
      </footer>
    </div>
  </section>
</div>
