<div class="form-container">
    <div class="form-box">
        <h2 class="form-title">{{ isEditMode ? 'Edit Stock' : 'Create New Stock' }}</h2>
        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
        <form (ngSubmit)="onSubmit()" class="form-content">
            <!-- Code -->
            <div class="input-group">
                <label for="codeInput" class="form-label">Stock Code <span class="required-asterisk">*</span></label>
                <input
                    type="text"
                    class="form-control custom-input"
                    [(ngModel)]="stockObj.code"
                    name="code"
                    id="codeInput"
                    placeholder="Enter stock code"
                    required
                />
            </div>

            <!-- Description -->
            <div class="input-group">
                <label for="descriptionInput" class="form-label">Description <span class="required-asterisk">*</span></label>
                <input
                    type="text"
                    class="form-control custom-input"
                    [(ngModel)]="stockObj.description"
                    name="description"
                    id="descriptionInput"
                    placeholder="Enter description"
                    required
                />
            </div>

            <!-- Entities -->
            <div class="input-group">
                <label for="entitiesSelect" class="form-label">Entities <span class="required-asterisk">*</span></label>
                <mat-form-field class="custom-mat-form-field" appearance="outline">
                    <mat-select
                        [(ngModel)]="stockObj.stockEntitiesId"
                        name="stockEntitiesId"
                        id="entitiesSelect"
                        placeholder="Select entities"
                        required
                    >
                        <mat-option *ngFor="let entity of entitiesList" [value]="entity.id">
                            {{ entity.name }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <!-- Status -->
            <div class="input-group">
                <label for="statusSelect" class="form-label">Status <span class="required-asterisk">*</span></label>
                <mat-form-field class="custom-mat-form-field" appearance="outline">
                    <mat-select
                        [(ngModel)]="stockObj.stockStatusId"
                        name="stockStatusId"
                        id="statusSelect"
                        placeholder="Select status"
                        required
                    >
                        <mat-option *ngFor="let status of statusList" [value]="status.id">
                            {{ status.status }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <!-- Supplier -->
            <div class="input-group">
                <label for="supplierSelect" class="form-label">Supplier <span class="required-asterisk">*</span></label>
                <mat-form-field class="custom-mat-form-field" appearance="outline">
                    <mat-select
                        [(ngModel)]="stockObj.stockSupplierId"
                        name="stockSupplierId"
                        id="supplierSelect"
                        placeholder="Select supplier"
                        required
                    >
                        <mat-option *ngFor="let supplier of supplierList" [value]="supplier.id">
                            {{ supplier.supplierName }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <!-- Created On -->
            <div class="input-group">
                <label for="createdOnInput" class="form-label">Created On <span class="required-asterisk">*</span></label>
                <mat-form-field class="custom-mat-form-field" appearance="outline">
                    <input
                        matInput
                        [matDatepicker]="picker"
                        [(ngModel)]="stockObj.createdOn"
                        name="createdOn"
                        id="createdOnInput"
                        placeholder="Select date"
                        required
                    />
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button
                    type="submit"
                    class="btn custom-btn primary-btn"
                    [disabled]="!isValidStock()"
                >
                    {{ isEditMode ? 'Update' : 'Create' }}
                </button>
                <button type="button" class="btn custom-btn secondary-btn" (click)="goBack()">Cancel</button>
            </div>
        </form>
    </div>
</div>
