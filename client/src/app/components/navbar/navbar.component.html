<nav class="navbar navbar-expand-lg navbar-transparent navbar-absolute fixed-top">
    <div class="container-fluid">
        <div class="navbar-wrapper">
            <a class="navbar-brand d-none" href="#">Brand</a>
        </div>
        
        <button mat-raised-button class="navbar-toggler" type="button" (click)="sidebarToggle()">
            <span class="sr-only">Toggle navigation</span>
            <span class="navbar-toggler-icon icon-bar"></span>
            <span class="navbar-toggler-icon icon-bar"></span>
            <span class="navbar-toggler-icon icon-bar"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navigation">
            <div class="search-container">
                <div class="search-input-wrapper">
                    <input type="text" class="search-input" placeholder="Search here...">
                    <div class="search-icon">
                        <i class="material-icons">search</i>
                    </div>
                </div>
            </div>

            <!-- Fixed conditional syntax -->
            <ng-container *ngIf="accountService.currentUser()">
                <button mat-button class="user-dropdown-button" [matMenuTriggerFor]="menu">
                    <div class="dropdown-content">
                        <span class="user-email">{{accountService.currentUser()?.email}}</span>
                        <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
                    </div>
                </button>
            </ng-container>
        </div>
    </div>
</nav>

<!-- Fixed menu reference -->
<mat-menu #menu="matMenu" class="custom-menu" yPosition="below" [overlapTrigger]="false">
    <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
    </button>
</mat-menu>
