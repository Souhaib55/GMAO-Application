<div class="login-container">
  <div class="login-content">
    <!-- Logo -->
    <div class="logo">
      <img src="assets/img/alcodex.png" alt="Alcodex">
    </div>
    
    <!-- Main content -->
    <div class="main-section">
      <div class="text-section">
        <h1 class="main-title"><span class="no-wrap">VOTRE MAINTENANCE</span>,<br>NOTRE PRIORITE.</h1>
        <p class="subtitle">Gérez vos interventions, équipements et équipes en toute simplicité.</p>
      </div>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="custom-input-container">
          <input type="email" formControlName="email" class="custom-input" placeholder="Name@mail.com">
          <div class="custom-input-icon">
            <i class="material-icons">mail</i>
          </div>
        </div>
        
        <div class="custom-input-container">
          <input type="password" formControlName="password" class="custom-input" placeholder="*******">
          <div class="custom-input-icon">
            <i class="material-icons">lock</i>
          </div>
        </div>
        
        <div class="form-links sign-up">
          <span>Sign up now</span>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="login-button">Login</button>
        </div>
        
        <div class="form-links forgot-password">
          <span>Forgot Password?</span>
        </div>
      </form>
    </div>
    
    <!-- Footer -->
    <div class="footer">
      <p>Solution GMAO — Powered by Alcodex.</p>
    </div>
  </div>
  
  <!-- Illustration -->
  <div class="illustration-section">
    <!-- Updated technician image -->
    <div class="technician-image">
      <img src="assets/login_images/asset1.png" alt="Maintenance Technician">
    </div>
    <div class="gear-icons">
      <img src="assets/SVG/wrench.svg" class="gear gear-1" alt="Large Gear">
      <img src="assets/SVG/wrench.svg" class="gear gear-2" alt="Medium Gear">
      <img src="assets/SVG/wrench.svg" class="gear gear-3" alt="Small Gear">
    </div>
  </div>
  
  <!-- Black border at the bottom -->
  <div class="bottom-border"></div>
</div>
