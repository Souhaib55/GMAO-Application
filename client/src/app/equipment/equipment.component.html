<div class="crud-container equipment-wrapper">
    <h1>Equipment Management</h1>
    <div class="header-actions">
        <button class="create-btn" (click)="openCreateModal()">Create New Equipment</button>
    </div>

    <!-- Equipment List Table -->
    <div class="product-list">
        <h2>Equipment List</h2>
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Designation</th>
                    <th>Family</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of equipmentList; let i = index">
                    <td>{{item.id}}</td>
                    <td>{{item.code}}</td>
                    <td>{{item.designation}}</td>
                    <td>{{item.familleEquipment?.libelleFamille || 'N/A'}}</td>
                    <td class="actions">
                        <button class="edit btn btn-primary btn-sm" (click)="editEquipment(item)">Edit</button>
                        <button class="delete btn btn-danger btn-sm" (click)="deleteEquipment(item)">Delete</button>
                    </td>
                </tr>
                <tr *ngIf="equipmentList.length === 0">
                    <td colspan="5">No equipment found.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal for Create/Edit -->
    <div class="modal" [class.active]="showModal">
        <div class="modal-content">
            <form>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="code" class="form-label">Code</label>
                                <input type="text" class="form-control" [(ngModel)]="equipmentObj.code" id="code" name="code" placeholder="Enter equipment code" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="designation" class="form-label">Designation</label>
                                <input type="text" class="form-control" [(ngModel)]="equipmentObj.designation" id="designation" name="designation" placeholder="Enter equipment designation" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="familleEquipmentId" class="form-label">Family</label>
                                <select class="form-control" [(ngModel)]="equipmentObj.familleEquipmentId" id="familleEquipmentId" name="familleEquipmentId" required>
                                    <option value="0" disabled>Select a family</option>
                                    <option *ngFor="let famille of familleList" [value]="famille.id">
                                        {{famille.libelleFamille}}
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <div *ngIf="equipmentObj.id === 0">
                        <button type="button" class="btn btn-primary save-btn" (click)="onSave()" [disabled]="!isValidEquipment()">Create</button>
                        <button type="button" class="btn btn-secondary cancel-btn" (click)="closeModal()">Cancel</button>
                    </div>
                    <div *ngIf="equipmentObj.id !== 0">
                        <button type="button" class="btn btn-primary save-btn" (click)="onUpdate()" [disabled]="!isValidEquipment()">Update</button>
                        <button type="button" class="btn btn-secondary cancel-btn" (click)="closeModal()">Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
